<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold price tracker</title>
<style>:root{--bg:#f1efe9;--panel:#fbfaf6;--ink:#1f2622;--mute:#6b736d;--line:#dcd8cc;--c22:#b8741a;--c24:#1f5f5b;--up:#2e7d4f;--down:#b23a3a}
@media(prefers-color-scheme:dark){:root{--bg:#161a18;--panel:#1d2321;--ink:#ece9df;--mute:#9aa39c;--line:#2e3632;--c22:#e0a24a;--c24:#5cc2b8;--up:#6fcf97;--down:#ef7f7f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 14px max(32px,env(safe-area-inset-bottom))}
h1{font:600 22px/1.2 Georgia,'Times New Roman',serif;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 14px;font-size:13px}
.prices{display:grid;grid-template-columns:1fr;border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden}
.p{padding:16px}
.p .k{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%}
.p .v{font:700 clamp(32px,10vw,44px)/1.1 system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:-.02em;margin:6px 0 2px}
.p .inr{font:600 20px/1.3 system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--mute);margin-bottom:4px}
.p .ch{font-size:14px}.up{color:var(--up)}.down{color:var(--down)}
.bar{display:flex;flex-direction:column;gap:10px;margin:14px 0 10px}
.seg{display:flex;width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{flex:1;border:0;background:none;color:var(--ink);padding:11px 4px;min-height:44px;font:inherit;font-size:15px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:600}
button:focus-visible{outline:2px solid var(--c24);outline-offset:-2px}
.live{display:flex;gap:10px;align-items:center;margin:0 0 10px}
.live a{flex:1;justify-content:center;min-height:44px;display:flex;align-items:center;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);text-decoration:none;font-size:15px}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 8px;height:300px;position:relative}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stats div{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;font-weight:600}
.stats small{display:block;color:var(--mute);font-weight:400;font-size:13px}
#msg{color:var(--mute);margin-top:14px}
.rng{margin:10px 0 0}
@media(min-width:700px){main{max-width:720px}.chart{height:400px}}
</style></head><body><main>
<h1>Gold price tracker</h1>
<p class="sub" id="sub">Loading readings…</p>
<section class="prices">
 <div class="p"><div class="k"><span class="dot" style="background:var(--c22)"></span>22k (916)</div><div class="v" id="v22">–</div><div class="inr" id="i22"></div><div class="ch" id="c22"></div></div>
</section>
<div class="bar"><div class="seg" id="unit"></div></div>
<div class="live"><a href="https://mustafajewellery.com/" target="_blank" rel="noopener">Check on Mustafa Jewellery ↗</a></div>
<div class="chart"><canvas id="cv" aria-label="Gold price over time" role="img"></canvas></div>
<div class="seg rng" id="range"></div>
<div class="stats" id="stats"></div>
<p id="msg"></p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const RANGES={'24H':1,'7D':7,'30D':30,'90D':90,'1Y':365,'All':null};
const st={range:'7D',unit:'1 g'};let rows=[],chart;
const $=id=>document.getElementById(id);
function seg(id,opts,key){const el=$(id);el.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.textContent=o;
 b.setAttribute('aria-pressed',st[key]===o);b.onclick=()=>{st[key]=o;render()};el.appendChild(b)})}
async function load(){
 try{const t=await (await fetch('data/prices.csv?'+Date.now())).text();
  rows=t.trim().split('\n').slice(1).map(l=>{const c=l.split(',');return{t:Date.parse(c[0]),a:+c[1],b:+c[2],fx:+c[3],ia:+c[4]||(+c[1])*(+c[3])}}).filter(r=>r.t&&r.a&&r.b);
 }catch(e){$('msg').textContent='Could not load data/prices.csv.';return}
 if(!rows.length){$('sub').textContent='No readings yet. Run the “Fetch gold price” workflow once.';return}
 render();
}
function conv(r){const m=(st.unit==='8 g'?8:1);return[r.a*m,r.b*m]}
const fmt=(n)=>n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const sym=()=>'S$';
function render(){
 seg('range',Object.keys(RANGES),'range');seg('unit',['1 g','8 g'],'unit');
 const last=rows[rows.length-1];
 const days=RANGES[st.range];const cut=days?last.t-days*864e5:0;
 const v=rows.filter(r=>r.t>=cut);const first=v[0];
 const [l22]=conv(last),[f22]=conv(first);
 $('v22').textContent=sym()+fmt(l22);
 $('i22').textContent='₹'+fmt(l22*last.fx);
 for(const [id,l,f] of [['c22',l22,f22]]){const d=l-f,p=f?d/f*100:0;
  $(id).className='ch '+(d>=0?'up':'down');$(id).textContent=`${d>=0?'▲':'▼'} ${fmt(Math.abs(d))} (${p.toFixed(2)}%) over ${st.range==='All'?'all time':st.range}`}
 $('sub').textContent=`Per ${st.unit}, SGD (today's price also in INR). Updated ${new Date(last.t).toLocaleString()} · ${rows.length} readings stored · SGD→INR ${last.fx.toFixed(3)}`;
 const mult=st.unit==='8 g'?8:1;const s22=v.map(r=>({x:r.t,y:conv(r)[0],inr:r.ia*mult}));
 const css=getComputedStyle(document.documentElement),c22=css.getPropertyValue('--c22'),grid=css.getPropertyValue('--line'),mute=css.getPropertyValue('--mute');
 const ds=(label,data,color)=>({label,data,borderColor:color,backgroundColor:color,borderWidth:2,pointRadius:v.length<60?3:0,pointHoverRadius:5,tension:.15});
 const span=(v[v.length-1].t-v[0].t)/864e5;
 const tick=x=>{const d=new Date(x);return span<=2?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):span>400?d.toLocaleDateString([],{month:'short',year:'2-digit'}):d.toLocaleDateString([],{day:'numeric',month:'short'})};
 if(chart)chart.destroy();
 chart=new Chart($('cv'),{type:'line',data:{datasets:[ds('22k',s22,c22)]},options:{
  responsive:true,maintainAspectRatio:false,animation:false,parsing:false,interaction:{mode:'index',intersect:false},
  scales:{x:{type:'linear',ticks:{callback:tick,color:mute,maxTicksLimit:7},grid:{color:grid}},
          y:{ticks:{color:mute,callback:x=>sym()+fmt(x)},grid:{color:grid}}},
  plugins:{legend:{labels:{color:mute,usePointStyle:true}},tooltip:{callbacks:{title:i=>new Date(i[0].parsed.x).toLocaleString(),label:c=>`${c.dataset.label}: ${sym()}${fmt(c.parsed.y)}  (₹${fmt(c.raw.inr)})`}}}}});
 const mm=a=>[Math.min(...a),Math.max(...a)];const [lo2,hi2]=mm(s22.map(p=>p.y));
 $('stats').innerHTML=[['22k high',hi2],['22k low',lo2]].map(([k,n])=>`<div><small>${k} (${st.range})</small>${sym()}${fmt(n)}</div>`).join('');
}
load();
</script></body></html>
